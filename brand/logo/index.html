<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentdom Logo Options</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
<style>body{margin:0;background:#f6eee2;color:#241a13;font:14px/1.45 system-ui,sans-serif;padding:28px 16px 60px}
h1{font:600 24px system-ui;margin:0 0 4px}p{margin:0 0 22px;color:#7a6a5c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px;max-width:1240px}
figure{margin:0}.lk{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;background:#fffbf5;border:1px solid #e6d8c4;border-radius:12px}.lk img{width:34px;border-radius:9px}.lk span{font:400 22px 'Instrument Serif',Georgia,serif}img{width:100%;aspect-ratio:1;display:block;border-radius:6px}
figcaption{margin-top:8px}figcaption b{display:block}figcaption span{color:#7a6a5c;font-size:13px}</style></head><body>
<h1>Agentdom logo options</h1><p>One colour, one square image each, in the site colours (brand brown and gold). The same file is used for the X avatar, the token and the favicon. Under each: how it sits in the site header.</p>
<div class="grid"><figure><img src="01-agent-wall.svg" alt="Agent Wall"><div class="lk"><img src="01-agent-wall.svg" alt=""><span>Agentdom</span></div><figcaption><b>01 · Agent Wall</b><span>A castle wall whose battlements are three agents, the middle one taller: the crown and the castle in one.</span></figcaption></figure>
<figure><img src="02-agent-crown.svg" alt="Agent Crown"><div class="lk"><img src="02-agent-crown.svg" alt=""><span>Agentdom</span></div><figcaption><b>02 · Agent Crown</b><span>Three agents standing shoulder to shoulder, the middle one taller: together they form a crown.</span></figcaption></figure>
<figure><img src="03-twin-towers.svg" alt="Twin Towers"><div class="lk"><img src="03-twin-towers.svg" alt=""><span>Agentdom</span></div><figcaption><b>03 · Twin Towers</b><span>Two pointed towers guarding an open gate: the realm, drawn like a storybook castle.</span></figcaption></figure>
<figure><img src="04-gate-agent.svg" alt="Gate Agent"><div class="lk"><img src="04-gate-agent.svg" alt=""><span>Agentdom</span></div><figcaption><b>04 · Gate Agent</b><span>An agent standing in the palace archway, ready to take your order.</span></figcaption></figure>
<figure><img src="05-keyhole-keep.svg" alt="Keyhole Keep"><div class="lk"><img src="05-keyhole-keep.svg" alt=""><span>Agentdom</span></div><figcaption><b>05 · Keyhole Keep</b><span>A castle keep with a keyhole door: your work stays locked inside the realm until you open it.</span></figcaption></figure>
<figure><img src="06-flag-tower.svg" alt="Flag Tower"><div class="lk"><img src="06-flag-tower.svg" alt=""><span>Agentdom</span></div><figcaption><b>06 · Flag Tower</b><span>One tower flying the realm flag: the place your agents report to.</span></figcaption></figure>
<figure><img src="07-crest-agents.svg" alt="Crest of Agents"><div class="lk"><img src="07-crest-agents.svg" alt=""><span>Agentdom</span></div><figcaption><b>07 · Crest of Agents</b><span>The royal crest with three agents cut into it, the middle one taller, like the court on a coat of arms.</span></figcaption></figure>
<figure><img src="08-castle.svg" alt="Castle"><div class="lk"><img src="08-castle.svg" alt=""><span>Agentdom</span></div><figcaption><b>08 · Castle</b><span>A castle whose battlements form a crown, with the gate open: come in, the realm is working.</span></figcaption></figure>
<figure><img src="09-castle-bubble.svg" alt="Castle Bubble"><div class="lk"><img src="09-castle-bubble.svg" alt=""><span>Agentdom</span></div><figcaption><b>09 · Castle Bubble</b><span>A chat bubble with battlements on top: you talk, the castle answers.</span></figcaption></figure>
<figure><img src="10-building-blocks.svg" alt="Building Blocks"><div class="lk"><img src="10-building-blocks.svg" alt=""><span>Agentdom</span></div><figcaption><b>10 · Building Blocks</b><span>Six blocks stacked into a pyramid with a crown on top: a kingdom built piece by piece, by agents.</span></figcaption></figure></div></body></html>
